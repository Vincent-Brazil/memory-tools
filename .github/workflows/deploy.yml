name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `toolbelt-llm-router` is a private GitHub dependency, and npm resolves it
      # over ssh even though package.json asks for the `github:` shorthand — so a
      # credential-less runner fails with "Permission denied (publickey)", exit
      # 128. Same three gotchas Railway hit, documented in railway.toml:
      # rewrite the ssh forms as well as https, and do it with GIT_CONFIG_* env
      # vars rather than `git config --global`, which npm's git subprocess
      # ignores. Scoped to this step so the token is never written to
      # GITHUB_ENV. The token goes in the USERNAME position: x-access-token:<token>
      # is the GitHub App convention and 404s with a fine-grained PAT.
      # TEMPORARY: remove once the credential is proven. Prints the token's type
      # and what the API says about it, never the value.
      - name: Diagnose the toolbelt credential
        env:
          TOK: ${{ secrets.TOOLBELT_TOKEN }}
        run: |
          echo "length: ${#TOK}"
          case "$TOK" in
            github_pat_*) echo "type: fine-grained PAT" ;;
            ghp_*)        echo "type: classic PAT" ;;
            gho_*)        echo "type: gh OAuth token" ;;
            ghs_*)        echo "type: App installation token" ;;
            "")           echo "type: EMPTY - the secret is not reaching this step" ;;
            *)            echo "type: unrecognised prefix" ;;
          esac
          echo "GET /repos/Vincent-Brazil/toolbelt -> $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" https://api.github.com/repos/Vincent-Brazil/toolbelt)"
          echo "GET /user                          -> $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" https://api.github.com/user)"
      - run: npm ci
        env:
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.TOOLBELT_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          GIT_CONFIG_KEY_1: url.https://${{ secrets.TOOLBELT_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/
          GIT_CONFIG_KEY_2: url.https://${{ secrets.TOOLBELT_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_2: 'git@github.com:'
      - run: npm test
      - run: npm run typecheck
      # Pages serves this repo from a subpath; Railway serves it from the root
      # and sets nothing. See the comment on `base` in vite.config.ts.
      - run: npm run build
        env:
          VITE_BASE: /memory-tools/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
